<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bài 26 — Form đăng ký với Bootstrap</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-light d-flex justify-content-center align-items-center min-vh-100 p-3">

    <div class="container" style="max-width: 650px;">
        <!-- Card bọc toàn bộ form -->
        <div class="card shadow border-0 rounded-3 overflow-hidden">
            
            <!-- Header card màu xanh (bg-success / #198754) -->
            <div class="card-header bg-success text-white text-center py-3">
                <h4 class="m-0 fw-bold fs-5">Đăng ký tham gia CLB Lập trình Web</h4>
            </div>

            <div class="card-body p-4">
                <form id="registerForm" class="needs-validation" novalidate>
                    
                    <div class="row g-3">
                        <!-- Họ và tên -->
                        <div class="col-12 col-md-6">
                            <label for="fullName" class="form-label fw-semibold text-secondary small">Họ và tên</label>
                            <input type="text" class="form-control" id="fullName" placeholder="Nguyễn Văn A" required>
                        </div>

                        <!-- Mã sinh viên -->
                        <div class="col-12 col-md-6">
                            <label for="studentId" class="form-label fw-semibold text-secondary small">Mã sinh viên</label>
                            <input type="text" class="form-control" id="studentId" placeholder="22xxxxxx" required>
                        </div>

                        <!-- Email -->
                        <div class="col-12 col-md-6">
                            <label for="email" class="form-label fw-semibold text-secondary small">Email</label>
                            <input type="email" class="form-control" id="email" placeholder="sv@tlu.edu.vn" required>
                        </div>

                        <!-- Số điện thoại -->
                        <div class="col-12 col-md-6">
                            <label for="phone" class="form-label fw-semibold text-secondary small">Số điện thoại</label>
                            <input type="tel" class="form-control" id="phone" placeholder="09xxxxxxxx" required>
                        </div>

                        <!-- Trình độ (Radio inline) -->
                        <div class="col-12">
                            <label class="form-label fw-semibold text-secondary small d-block">Trình độ</label>
                            <div class="form-check form-check-inline">
                                <input class="form-check-input" type="radio" name="level" id="levelBasic" value="Cơ bản" checked>
                                <label class="form-check-label small" for="levelBasic">Cơ bản</label>
                            </div>
                            <div class="form-check form-check-inline">
                                <input class="form-check-input" type="radio" name="level" id="levelMedium" value="Khá">
                                <label class="form-check-label small" for="levelMedium">Khá</label>
                            </div>
                            <div class="form-check form-check-inline">
                                <input class="form-check-input" type="radio" name="level" id="levelGood" value="Tốt">
                                <label class="form-check-label small" for="levelGood">Tốt</label>
                            </div>
                        </div>

                        <!-- Chọn lớp (Form select) -->
                        <div class="col-12">
                            <label for="classSelect" class="form-label fw-semibold text-secondary small">Chọn lớp</label>
                            <select class="form-select" id="classSelect" required>
                                <option value="67CNTT1" selected>67CNTT1</option>
                                <option value="67CNTT2">67CNTT2</option>
                                <option value="67CNTT3">67CNTT3</option>
                                <option value="67HTTT">67HTTT</option>
                            </select>
                        </div>

                        <!-- Checkbox Cam kết -->
                        <div class="col-12">
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" value="" id="commitCheck" required>
                                <label class="form-check-label small" for="commitCheck">
                                    Tôi cam kết tự làm bài và quay video OBS
                                </label>
                            </div>
                        </div>

                        <!-- 2 Nút hành động ở góc phải -->
                        <div class="col-12 d-flex justify-content-end gap-2 mt-4">
                            <button type="reset" class="btn btn-outline-secondary px-3">Nhập lại</button>
                            <button type="submit" class="btn btn-success px-4">Đăng ký</button>
                        </div>
                    </div>

                </form>
            </div>

        </div>
    </div>

    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/bootstrap.bundle.min.js"></script>
    <!-- Custom JS -->
    <script src="script.js"></script>
</body>
</html>
