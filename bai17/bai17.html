<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bài 17 — Kiểm tra biểu mẫu bằng JavaScript</title>
    <link rel="stylesheet" href="bai17.css">
</head>
<body>

    <!-- Thẻ form: nền #FFFFFF, viền #fed7aa, bo góc 12px -->
    <form id="registerForm" class="form-card" novalidate>
        <!-- Tiêu đề: chữ #c2410c -->
        <h2 class="form-title">Đăng ký tài khoản</h2>
        <p class="form-subtitle">Dữ liệu được kiểm tra bằng JavaScript trước khi gửi.</p>
 
        <!-- Họ và tên -->
        <div class="form-group">
            <label for="fullname">Họ và tên</label>
            <input type="text" id="fullname" placeholder="Nguyễn Văn An">
            <div class="message" id="fullnameMsg"></div>
        </div>

        <!-- Email -->
        <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" placeholder="an.nv@domain.com">
            <div class="message" id="emailMsg"></div>
        </div>

        <!-- Mật khẩu -->
        <div class="form-group">
            <label for="password">Mật khẩu</label>
            <input type="password" id="password" placeholder="••••••">
            <div class="message" id="passwordMsg"></div>
        </div>

        <!-- Xác nhận mật khẩu -->
        <div class="form-group">
            <label for="confirmPassword">Xác nhận mật khẩu</label>
            <input type="password" id="confirmPassword" placeholder="••••••">
            <div class="message" id="confirmPasswordMsg"></div>
        </div>

        <!-- Nút đăng ký: nền #c2410c, chữ #FFFFFF -->
        <button type="submit" class="btn-submit">Đăng ký</button>
    </form>

    <script src="bai17.js"></script>
</body>
</html>
