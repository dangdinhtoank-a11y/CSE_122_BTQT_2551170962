<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bài 10 — Trang liên hệ (biểu mẫu HTML)</title>
    <link rel="stylesheet" href="bai10.css">
</head>
<body>
 
    <div class="contact-card">
        <!-- Tiêu đề form -->
        <header class="form-header">
            <h1 class="form-title">Liên hệ với chúng tôi</h1>
            <p class="form-subtitle">Vui lòng điền thông tin bên dưới, chúng tôi sẽ phản hồi trong 24 giờ.</p>
        </header>

        <!-- Biểu mẫu liên hệ -->
        <form class="contact-form" action="#" method="post">
            <!-- Hàng 1: Họ và tên & Email (Xếp 2 cột) -->
            <div class="form-row">
                <div class="form-group">
                    <label for="fullname">Họ và tên</label>
                    <input type="text" id="fullname" name="fullname" placeholder="Nguyễn Văn An" required>
                </div>
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" placeholder="an.nv@tlu.edu.vn" required>
                </div>
            </div>

            <!-- Hàng 2: Số điện thoại & Chủ đề (Xếp 2 cột) -->
            <div class="form-row">
                <div class="form-group">
                    <label for="phone">Số điện thoại</label>
                    <input type="tel" id="phone" name="phone" placeholder="0987 654 321">
                </div>
                <div class="form-group">
                    <label for="subject">Chủ đề</label>
                    <select id="subject" name="subject">
                        <option value="khoa-hoc">Hỏi về khoá học</option>
                        <option value="tu-van">Tư vấn tuyển sinh</option>
                        <option value="gop-y">Góp ý ý kiến</option>
                        <option value="khac">Khác</option>
                    </select>
                </div>
            </div>

            <!-- Hàng 3: Nội dung (Dùng textarea, rows=4) -->
            <div class="form-group">
                <label for="message">Nội dung</label>
                <textarea id="message" name="message" rows="4" placeholder="Em muốn hỏi về lịch nộp bài tập môn Lập trình Web ạ."></textarea>
            </div>

            <!-- Hàng 4: Checkbox đồng ý -->
            <div class="form-group checkbox-group">
                <input type="checkbox" id="agree" name="agree">
                <label for="agree">Tôi đồng ý nhận email phản hồi.</label>
            </div>

            <!-- Hàng 5: Nút Gửi liên hệ và Nhập lại -->
            <div class="button-group">
                <button type="submit" class="btn btn-submit">Gửi liên hệ</button>
                <button type="reset" class="btn btn-reset">Nhập lại</button>
            </div>
        </form>
    </div>

</body>
</html>
