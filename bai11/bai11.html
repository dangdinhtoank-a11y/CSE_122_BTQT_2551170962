<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bài 11 — Thư viện ảnh (figure / figcaption)</title>
    <link rel="stylesheet" href="bai11.css">
</head>
<body>

    <div class="gallery-container">
        <!-- Tiêu đề và mô tả đầu trang -->
        <header class="gallery-header">
            <h1 class="gallery-title">Thư viện ảnh Việt Nam</h1>
            <p class="gallery-description">Bộ sưu tập 6 danh thắng tiêu biểu — minh hoạ thẻ figure / figcaption.</p>
        </header>

        <!-- Lưới 6 ảnh danh thắng -->
        <main class="gallery-grid">
            <!-- Ảnh 1 -->
            <figure class="gallery-item">
                <img src="Anh/Bai11/1-vinh-ha-long.jpg" alt="Vịnh Hạ Long" class="gallery-img">
                <figcaption class="gallery-caption">Hình 1. Vịnh Hạ Long</figcaption>
            </figure>

            <!-- Ảnh 2 -->
            <figure class="gallery-item">
                <img src="Anh/Bai11/2-son-doong.jpg" alt="Hang Sơn Đoòng" class="gallery-img">
                <figcaption class="gallery-caption">Hình 2. Hang Sơn Đoòng</figcaption>
            </figure>
 
            <!-- Ảnh 3 -->
            <figure class="gallery-item">
                <img src="Anh/Bai11/3-thac-ban-gioc.jpg" alt="Thác Bản Giốc" class="gallery-img">
                <figcaption class="gallery-caption">Hình 3. Thác Bản Giốc</figcaption>
            </figure>

            <!-- Ảnh 4 -->
            <figure class="gallery-item">
                <img src="Anh/Bai11/4-fansipan.jpg" alt="Fansipan" class="gallery-img">
                <figcaption class="gallery-caption">Hình 4. Fansipan</figcaption>
            </figure>

            <!-- Ảnh 5 -->
            <figure class="gallery-item">
                <img src="Anh/Bai11/5-mekong.jpg" alt="Đồng bằng sông Cửu Long" class="gallery-img">
                <figcaption class="gallery-caption">Hình 5. Đồng bằng sông Cửu Long</figcaption>
            </figure>

            <!-- Ảnh 6 -->
            <figure class="gallery-item">
                <img src="Anh/Bai11/6-phong-nha.jpg" alt="Động Phong Nha" class="gallery-img">
                <figcaption class="gallery-caption">Hình 6. Động Phong Nha</figcaption>
            </figure>
        </main>
    </div>

</body>
</html>
