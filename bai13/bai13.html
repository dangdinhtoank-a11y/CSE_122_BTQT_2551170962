<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bài 13 — Đồng hồ số</title>
    <link rel="stylesheet" href="bai13.css">
</head>
<body>
  
    <div class="container">
        <!-- Khung đồng hồ nền đen chứa các thẻ img -->
        <div class="clock-box">
            <!-- Giờ (hh) -->
            <img id="h1" src="Anh/Bai13/00.gif" alt="0">
            <img id="h2" src="Anh/Bai13/00.gif" alt="0">
            
            <!-- Dấu hai chấm -->
            <img src="Anh/Bai13/haicham.gif" alt=":">
            
            <!-- Phút (mm) -->
            <img id="m1" src="Anh/Bai13/00.gif" alt="0">
            <img id="m2" src="Anh/Bai13/00.gif" alt="0">
            
            <!-- Dấu hai chấm -->
            <img src="Anh/Bai13/haicham.gif" alt=":">
            
            <!-- Giây (ss) -->
            <img id="s1" src="Anh/Bai13/00.gif" alt="0">
            <img id="s2" src="Anh/Bai13/00.gif" alt="0">
        </div>

        <!-- Khung hiển thị lời chào theo buổi -->
        <div id="greeting" class="greeting-box">
            Chào buổi sáng
        </div>
    </div>

    <script src="bai13.js"></script>
</body>
</html>
