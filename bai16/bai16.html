<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bài 16 — Danh sách việc cần làm</title>
    <link rel="stylesheet" href="bai16.css">
</head>
<body>

    <!-- Thẻ ứng dụng rộng 600px, nền #FFFFFF, bóng đổ -->
    <div class="todo-card">
        <!-- Tiêu đề: nền #6d28d9, chữ #FFFFFF, kèm mô tả -->
        <header class="todo-header">
            <h1>Danh sách việc cần làm</h1>
            <p>Thêm việc mới, đánh dấu hoàn thành hoặc xoá — tất cả bằng JavaScript.</p>
        </header>
 
        <div class="todo-body">
            <!-- Ô nhập + nút Thêm (#6d28d9) -->
            <div class="input-group">
                <input type="text" id="todoInput" placeholder="Hoàn thành bài tập Lập trình Web">
                <button id="addBtn">Thêm</button>
            </div>

            <!-- Danh sách việc cần làm (kẻ nét đứt #ede9fe) -->
            <ul id="todoList" class="todo-list">
                <!-- Mục mẫu 1 (Đã hoàn thành) -->
                <li class="completed">
                    <span class="custom-checkbox"></span>
                    <span class="task-text">Đọc chương HTML5 cơ bản</span>
                    <button class="delete-btn">Xoá</button>
                </li>
                <!-- Mục mẫu 2 -->
                <li>
                    <span class="custom-checkbox"></span>
                    <span class="task-text">Làm bài tập CSS Grid</span>
                    <button class="delete-btn">Xoá</button>
                </li>
                <!-- Mục mẫu 3 -->
                <li>
                    <span class="custom-checkbox"></span>
                    <span class="task-text">Quay video OBS nộp bài</span>
                    <button class="delete-btn">Xoá</button>
                </li>
            </ul>

            <!-- Thống kê số việc còn lại -->
            <div id="remainingCount" class="remaining-count">
                Còn 2 việc chưa hoàn thành
            </div>
        </div>
    </div>

    <script src="bai16.js"></script>
</body>
</html>
