<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bài 30 — Bảng điều khiển (Bootstrap)</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="d-flex min-vh-100 bg-light">
        <aside class="sidebar p-3 text-white">
            <h5 class="fw-bold px-2 mb-4 fs-6 text-uppercase tracking-wider">CSE.TLU Admin</h5>
            <ul class="nav nav-pills flex-column mb-auto gap-1">
                <li class="nav-item">
                    <a href="#" class="nav-link active rounded-2 text-white">Bảng điều khiển</a>
                </li>
                <li class="nav-item">
                    <a href="#" class="nav-link text-secondary">Bài tập</a>
                </li>
                <li class="nav-item">
                    <a href="#" class="nav-link text-secondary">Sinh viên</a>
                </li>
                <li class="nav-item">
                    <a href="#" class="nav-link text-secondary">Điểm số</a>
                </li>
            </ul>
        </aside>

        <main class="flex-grow-1 p-4">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h4 class="fw-bold m-0 text-dark">Bảng điều khiển</h4>
                <div class="d-flex gap-2">
                    <span class="badge bg-warning text-dark align-self-center px-3 py-2 rounded-2">3 bài mới</span>
                    <button class="btn btn-primary btn-sm px-3 fw-semibold">Xuất báo cáo</button>
                </div>
            </div>

            <div class="row g-3 mb-4">
                <div class="col-12 col-sm-6 col-md-3">
                    <div class="card border-0 shadow-sm p-3 rounded-3">
                        <small class="text-secondary fw-semibold">Sinh viên</small>
                        <h3 class="fw-bold my-1 text-dark">128</h3>
                        <div class="progress mt-2" style="height: 6px;">
                            <div class="progress-bar bg-primary" role="progressbar" style="width: 80%" aria-valuenow="80" aria-valuemin="0" aria-valuemax="100"></div>
                        </div>
                    </div>
                </div>

                <div class="col-12 col-sm-6 col-md-3">
                    <div class="card border-0 shadow-sm p-3 rounded-3">
                        <small class="text-secondary fw-semibold">Đã nộp</small>
                        <h3 class="fw-bold my-1 text-dark">96</h3>
                        <div class="progress mt-2" style="height: 6px;">
                            <div class="progress-bar bg-success" role="progressbar" style="width: 75%" aria-valuenow="75" aria-valuemin="0" aria-valuemax="100"></div>
                        </div>
                    </div>
                </div>

                <div class="col-12 col-sm-6 col-md-3">
                    <div class="card border-0 shadow-sm p-3 rounded-3">
                        <small class="text-secondary fw-semibold">Chưa nộp</small>
                        <h3 class="fw-bold my-1 text-dark">32</h3>
                        <div class="progress mt-2" style="height: 6px;">
                            <div class="progress-bar bg-danger" role="progressbar" style="width: 25%" aria-valuenow="25" aria-valuemin="0" aria-valuemax="100"></div>
                        </div>
                    </div>
                </div>

                <div class="col-12 col-sm-6 col-md-3">
                    <div class="card border-0 shadow-sm p-3 rounded-3">
                        <small class="text-secondary fw-semibold">Điểm TB</small>
                        <h3 class="fw-bold my-1 text-dark">7.8</h3>
                        <div class="progress mt-2" style="height: 6px;">
                            <div class="progress-bar bg-warning" role="progressbar" style="width: 78%" aria-valuenow="78" aria-valuemin="0" aria-valuemax="100"></div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="card border-0 shadow-sm rounded-3">
                <div class="card-header bg-white border-bottom-0 pt-3 px-3">
                    <h6 class="fw-bold m-0 text-dark">Tiến độ theo chương</h6>
                </div>
                <div class="card-body p-0">
                    <ul class="list-group list-group-flush">
                        <li class="list-group-item d-flex justify-content-between align-items-center px-3 py-3">
                            <span class="small fw-semibold text-secondary">Chương 1 — HTML5</span>
                            <span class="badge bg-success px-2 py-1">100%</span>
                        </li>
                        <li class="list-group-item d-flex justify-content-between align-items-center px-3 py-3">
                            <span class="small fw-semibold text-secondary">Chương 2 — JavaScript</span>
                            <span class="badge bg-info text-white px-2 py-1">82%</span>
                        </li>
                        <li class="list-group-item d-flex justify-content-between align-items-center px-3 py-3">
                            <span class="small fw-semibold text-secondary">Chương 3 — CSS3</span>
                            <span class="badge bg-info text-white px-2 py-1">74%</span>
                        </li>
                        <li class="list-group-item d-flex justify-content-between align-items-center px-3 py-3">
                            <span class="small fw-semibold text-secondary">Chương 4 — Bootstrap 5</span>
                            <span class="badge bg-secondary px-2 py-1">45%</span>
                        </li>
                    </ul>
                </div>
            </div>
        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
